services:
  emby-migrator:
    image: ${EMBY_MIGRATOR_IMAGE:-czppwa/emby-migrator:latest}
    container_name: emby-migrator
    # Default to loopback-only publishing so the web UI is not exposed to the
    # network by default. Remove the "127.0.0.1:" prefix to expose remotely
    # (put it behind TLS or an SSH tunnel first), or restore
    # `network_mode: host` if you need the container to share the host stack.
    ports:
      - "127.0.0.1:8787:8787"
    # Lets the container reach an Emby running on the host via
    # http://host.docker.internal:8096 without switching to host networking.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 30s
    environment:
      TZ: Asia/Shanghai
      EMBY_MIGRATOR_PASSWORD: password
      EMBY_MIGRATOR_IMPORT_ROOT: /imports
      EMBY_MIGRATOR_EMBY_DB_ROOT: /emby-dbs
      EMBY_MIGRATOR_DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - ${EMBY_MIGRATOR_DATA_DIR:-/opt/emby-migrator/data}:/data
      - ${EMBY_MIGRATOR_CONFIG_DIR:-/opt/emby-migrator/config}:/config
      - ${EMBY_MIGRATOR_IMPORT_DIR:-/opt/emby-migrator/imports}:/imports
      - ${EMBY_CONFIG_DIR:-/opt/emby/config}:/emby-dbs/default
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
